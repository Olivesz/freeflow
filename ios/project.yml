name: Freeflow
options:
  bundleIdPrefix: com.olivesz.freeflow
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    # Automatic signing: Xcode fills DEVELOPMENT_TEAM when you pick your team
    # (free personal team is fine). Simulator builds pass CODE_SIGNING_ALLOWED=NO
    # on the command line and ignore this.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: "NO"
targets:
  FreeflowKB:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.olivesz.freeflow.kb
        INFOPLIST_FILE: App/Info.plist
    dependencies:
      - target: Keyboard
        embed: true
  Keyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.olivesz.freeflow.kb.keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
